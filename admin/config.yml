backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)

media_folder: "public/images/uploads" # Media files will be stored in the repo under public/images/uploads
public_folder: "/images/uploads" # The src attribute for uploaded media will begin with /images/uploads

collections:
  - name: "projects" # Used in routes, e.g., /admin/collections/projects
    label: "Portfolio Projects" # Used in the UI
    folder: "src/content/projects" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., title.md
    fields: # The fields for each document
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Link", name: "link", widget: "string", required: false}
      - {label: "GitHub Link", name: "github", widget: "string", required: false}
      - {label: "Technologies", name: "technologies", widget: "list"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Order", name: "order", widget: "number", default: 999}
      - {label: "Body", name: "body", widget: "markdown", required: false}
  
  - name: "skills"
    label: "Skills"
    folder: "src/content/skills"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Skills", name: "skills", widget: "list"}
      - {label: "Icon", name: "icon", widget: "string", required: false}
      - {label: "Order", name: "order", widget: "number", default: 999}
  
  - name: "about"
    label: "About Page"
    files:
      - label: "About Content"
        name: "about"
        file: "src/content/about.json"
        fields:
          - {label: "Bio", name: "bio", widget: "markdown"}
          - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Education"
            name: "education"
            widget: "list"
            fields:
              - {label: "Institution", name: "institution", widget: "string"}
              - {label: "Degree", name: "degree", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
          - label: "Experience"
            name: "experience"
            widget: "list"
            fields:
              - {label: "Company", name: "company", widget: "string"}
              - {label: "Position", name: "position", widget: "string"}
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
