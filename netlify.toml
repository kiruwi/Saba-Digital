[build]
  command = "node netlify-build-scripts/process-cms-content.js && CI=false npm run build"
  publish = "build"

[build.environment]
  CI = "false"

# Security headers configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self';
      script-src 'self' https://www.google-analytics.com https://www.googletagmanager.com 'unsafe-inline';
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      img-src 'self' data: https://www.google-analytics.com https://i.ytimg.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://www.google-analytics.com;
      frame-src https://www.youtube.com https://www.youtube-nocookie.com;
      upgrade-insecure-requests;"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
